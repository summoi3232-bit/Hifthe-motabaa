<style>
:root{--bg:#F4F0E4;--card:#FFFDF7;--ink:#14302B;--mute:#566A64;--line:#DDD5BF;--teal:#14574D;--tealsoft:#DCEBE5;--gold:#B88A2A;--gt:#7A5A12;--goldsoft:#F3E7C6;--danger:#A3382F;--hd:#0F3D36;--hdink:#F7F1DD;--btn:#14574D;--btnink:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1B18;--card:#12302A;--ink:#EDE8D6;--mute:#A5BBB4;--line:#24493F;--teal:#5FC0AB;--tealsoft:#17413A;--gold:#E2B85A;--gt:#E2B85A;--goldsoft:#3A3318;--danger:#F08F85;--hd:#071512;--hdink:#F2E9C9;--btn:#5FC0AB;--btnink:#0B1B18}}
:root[data-theme="dark"]{--bg:#0B1B18;--card:#12302A;--ink:#EDE8D6;--mute:#A5BBB4;--line:#24493F;--teal:#5FC0AB;--tealsoft:#17413A;--gold:#E2B85A;--gt:#E2B85A;--goldsoft:#3A3318;--danger:#F08F85;--hd:#071512;--hdink:#F2E9C9;--btn:#5FC0AB;--btnink:#0B1B18}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Tajawal,system-ui,sans-serif;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}

.st{display:flex;gap:8px}.st div{flex:1;background:rgba(255,255,255,.09);border-radius:12px;padding:8px 4px;text-align:center;font-size:13px}.st b{display:block;font-size:24px;color:var(--gold);line-height:1.2}

nav button em{position:absolute;top:2px;inset-inline-start:50%;margin-inline-start:6px;background:var(--gold);color:#fff;font-style:normal;font-size:10px;border-radius:9px;padding:0 5px}
#toast{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center;z-index:9}#toast.s{opacity:1}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.acts.g4{gap:6px}.acts.g4 button{padding:8px 2px;font-size:14px;line-height:1.3}.acts.g4 small{display:block;font-size:11px;font-weight:500;opacity:.9}

<body>
<header><div class="in"><div class="top"><h1>متابعة الحفظ</h1><button class="ghost" style="color:var(--gold);border-color:var(--gold)" onclick="go('s')" aria-label="الإعدادات">⚙</button></div><p>حفظ ← تثبيت ← مراجعة ← ورد · <span id="hd"></span></p><div class="st" id="hs"></div></div></header>
<main id="app"></main>
<div id="toast"></div>
<nav id="nav"></nav>
<script>
const SD="الفاتحة:7,البقرة:286,آل عمران:200,النساء:176,المائدة:120,الأنعام:165,الأعراف:206,الأنفال:75,التوبة:129,يونس:109,هود:123,يوسف:111,الرعد:43,إبراهيم:52,الحجر:99,النحل:128,الإسراء:111,الكهف:110,مريم:98,طه:135,الأنبياء:112,الحج:78,المؤمنون:118,النور:64,الفرقان:77,الشعراء:227,النمل:93,القصص:88,العنكبوت:69,الروم:60,لقمان:34,السجدة:30,الأحزاب:73,سبأ:54,فاطر:45,يس:83,الصافات:182,ص:88,الزمر:75,غافر:85,فصلت:54,الشورى:53,الزخرف:89,الدخان:59,الجاثية:37,الأحقاف:35,محمد:38,الفتح:29,الحجرات:18,ق:45,الذاريات:60,الطور:49,النجم:62,القمر:55,الرحمن:78,الواقعة:96,الحديد:29,المجادلة:22,الحشر:24,الممتحنة:13,الصف:14,الجمعة:11,المنافقون:11,التغابن:18,الطلاق:12,التحريم:12,الملك:30,القلم:52,الحاقة:52,المعارج:44,نوح:28,الجن:28,المزمل:20,المدثر:56,القيامة:40,الإنسان:31,المرسلات:50,النبأ:40,النازعات:46,عبس:42,التكوير:29,الانفطار:19,المطففين:36,الانشقاق:25,البروج:22,الطارق:17,الأعلى:19,الغاشية:26,الفجر:30,البلد:20,الشمس:15,الليل:21,الضحى:11,الشرح:8,التين:8,العلق:19,القدر:5,البينة:8,الزلزلة:8,العاديات:11,القارعة:11,التكاثر:8,العصر:3,الهمزة:9,الفيل:5,قريش:4,الماعون:7,الكوثر:3,الكافرون:6,النصر:3,المسد:5,الإخلاص:4,الفلق:5,الناس:6".split(",").map(x=>{const[a,b]=x.split(":");return[a,+b]});
const KEY="hifz-merged-v1",OLD=["hifz-pipeline-v1","hifz-plan-v1"];
const WD=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const STG={aqli:"الحفظ العقلي",lisan:"الحفظ اللساني",near:"مراجعة متباعدة",stable:"مثبّت",wird:"في الورد"};
const L=["استماع مركّز لمصحف مجوَّد","تكرار نظرًا","تكرار عن ظهر قلب"];
/* جدولة المراجعة: SM-2 — المراجعتان الأوليان ثابتتان (FIX) ثم الفاصل = السابق × معامل السهولة، ويتثبّت المقطع حين يبلغ فاصله GRAD يومًا */
const INT=[3,7,30],EF0=2.5,EFMIN=1.3,FIX=[3,7],GRAD=30,MAXI=90,Q4=[1,3,4,5];
let st={items:[],w:{},tab:"today",sel:0,bk:0,set:{lt:30,rm:false,hr:"18:00",ln:"",push:0,wm:7},tm:{},ses:[],err:{},log:[]};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>ymd(new Date());
const D=d=>new Date(d+"T00:00:00");
const days=d=>d?Math.round((D(today())-D(d))/864e5):null;
const addDays=(d,n)=>{const x=D(d);x.setDate(x.getDate()+n);return ymd(x)};
const fd=d=>d?WD[D(d).getDay()]+" "+d.split("-").reverse().join("/"):"";
const dws=n=>n==1?"يومًا واحدًا":n==2?"يومين":n<=10?n+" أيامٍ":n+" يومًا";
const dots=(n,m)=>Array.from({length:m},(_,k)=>`<i class="${k<n?"on":""}"></i>`).join("");
const nm=i=>SD[i][0];
const rng=i=>i.a?(i.a===i.b?`آية ${i.a}`:`الآيات ${i.a} – ${i.b}`):esc(i.p||"مقطع");
const LT=()=>st.set.lt||30;
const inprog=i=>i.stage==="aqli"||i.stage==="lisan";
const rf=i=>i.lastRev||i.tdate||i.date;
const reps=i=>i.reps!==undefined?i.reps:(i.lv||0);
const efo=o=>o.ef||EF0;
const iv=i=>i.iv||INT[Math.min(2,i.lv||0)];
const wmax=()=>st.set.wm||7;
/* معامل السهولة بعد تقييم g (0 ضعيفة،1 متردد،2 متقنة،3 سهلة) — معادلة SM-2 */
const efn=(ef,g)=>{const q=Q4[g];return Math.max(EFMIN,Math.round((ef+0.1-(5-q)*(0.08+(5-q)*0.02))*100)/100)};
/* الفاصل القادم للمقطع لو قُيّم بـ g (يُحسب بالمعامل قبل تعديله) */
function nextIv(i,g){if(g===0)return null;const ivl=iv(i);if(g===1)return ivl;const r=reps(i)+1,ef=efn(efo(i),g);
 return Math.min(MAXI,r<FIX.length?FIX[r]:Math.max(ivl+1,Math.round(ivl*ef)))}
function wnext(w,g){if(g===0||g===1)return 3;return Math.max(7,Math.min(wmax(),Math.round(wiv(w)*efn(efo(w),g))))}
const wiv=w=>w.iv||7;
const wd=s=>st.w[s].last===null||days(st.w[s].last)>=wiv(st.w[s]);
const nd=i=>i.stage==="near"&&days(rf(i))>=iv(i);
const lg=(t,q)=>st.log.push({d:today(),t,q});
const find=id=>st.items.find(i=>i.id===id);
const go=t=>{st.tab=t;render();scrollTo(0,0)};
const bar=p=>`<div class="bar"><i style="width:${p}%"></i></div>`;
let uid=Date.now();
/* ===== البيانات والترحيل من التطبيقين القديمين ===== */
const dat=()=>({v:2,items:st.items,w:st.w,set:st.set,tm:st.tm,ses:st.ses,err:st.err,log:st.log});
function ld(o){st.items=o.items||[];st.w=o.w||{};st.set=Object.assign(st.set,o.set||{});st.tm=o.tm||{};st.ses=o.ses||[];st.err=o.err||{};st.log=o.log||[]}
function conv(o){
 if(!o||!Array.isArray(o.items))return null;
 if(o.v===2)return o;
 const items=[],w={},ix=n=>SD.findIndex(x=>x[0]===String(n).trim());
 if(Array.isArray(o.wird)||o.items.some(x=>x.surah!==undefined)){ /* تطبيق متابعة الحفظ القديم */
  o.items.forEach(x=>{const s=ix(x.surah);if(s<0)return;
   const m=String(x.part||"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).match(/\d+/g);let a=0,b=0;
   if(m){a=+m[0];b=+(m[1]||m[0]);if(a>b)[a,b]=[b,a];if(a<1||b>SD[s][1])a=b=0}
   const g=x.stage==1?"aqli":x.stage==2?"lisan":x.stage==3?"near":"stable",r=x.rev||0;
   items.push({id:++uid,s,a,b,p:x.part||"",stage:g,date:x.created||x.last||today(),c:x.c||[0,0,0],lisan:x.lisan||0,lv:g==="near"?Math.min(2,r):g==="stable"?3:0,lastRev:g==="near"&&r>0?x.last:null,tdate:g==="near"&&r==0?x.last:null,revs:r,bk:null})});
  (o.wird||[]).forEach(r=>{const s=ix(r.surah);if(s>=0)w[s]={last:r.last||null,since:r.added||today()}});
  items.forEach(i=>{if(w[i.s]&&i.stage==="stable")i.stage="wird"});
  return{items,w,set:{},ses:[],err:{},log:[]}
 }
 /* تطبيق مراحل الحفظ القديم */
 const mp=[0,0,1,1,2];
 o.items.forEach(x=>{const g=x.stage==="tathbit"?"lisan":x.stage==="near"?"near":"wird";
  items.push({id:++uid,s:x.s,a:x.a,b:x.b,stage:g,date:x.date,c:[3,3,3],lisan:x.reps||0,lv:g==="near"?mp[x.lv||0]:g==="wird"?3:0,lastRev:x.lastRev||null,tdate:x.tdate||null,revs:x.revs||0,bk:x.bk||null})});
 const ss=o.set||{};
 return{items,w:o.w||{},set:{rm:ss.rm,hr:ss.hr},ses:o.ses||[],err:o.err||{},log:o.log||[]}
}
function migrate(){let n=0;OLD.forEach(k=>{try{const r=localStorage.getItem(k);if(!r)return;const c=conv(JSON.parse(r));if(!c)return;
 st.items.push(...c.items);Object.assign(st.w,c.w);st.ses.push(...(c.ses||[]));st.log.push(...(c.log||[]));Object.assign(st.err,c.err||{});
 if(c.set&&c.set.hr){st.set.hr=c.set.hr;st.set.rm=!!c.set.rm}n++}catch(e){}});
 if(n)setTimeout(()=>{save();render();toast("نُقلت بياناتك من النسخة السابقة")},400)}
try{const r=localStorage.getItem(KEY);if(r)ld(JSON.parse(r));else migrate()}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(dat()))}catch(e){}syncIdb();psyncLater()};
function syncIdb(){try{const q=indexedDB.open("hifz",1);q.onupgradeneeded=()=>q.result.createObjectStore("k");q.onsuccess=()=>{const tx=q.result.transaction("k","readwrite");tx.objectStore("k").put({rm:st.set.rm,hr:st.set.hr,g:gaps().map(x=>({d:x.d,m:x.m}))},"g")}}catch(e){}}
function toast(t){const e=$("#toast");e.textContent=t;e.className="s";clearTimeout(toast.t);toast.t=setTimeout(()=>e.className="",2600)}
/* ===== تغطية الآيات ===== */
function covered(s){const set=new Set();st.items.filter(i=>i.s===s&&i.a).forEach(i=>{for(let k=i.a;k<=i.b;k++)set.add(k)});return set}
function nextFree(s){const c=covered(s);for(let k=1;k<=SD[s][1];k++)if(!c.has(k))return k;return null}
function limit(s,a){const c=covered(s);for(let k=a+1;k<=SD[s][1];k++)if(c.has(k))return k-1;return SD[s][1]}
function opts(a,b,sel,dis){let h="";for(let k=a;k<=b;k++)h+=`<option value="${k}" ${k===sel?"selected":""} ${dis&&dis(k)?"disabled":""}>${k}</option>`;return h}
function fixTo(){const a=+$("#a").value,l=limit(st.sel,a),c=+$("#b").value;$("#b").innerHTML=opts(a,l,c>=a&&c<=l?c:Math.min(l,a+4))}
/* ===== الغفلة والتنبيه ===== */
function gaps(){const r=[];st.items.forEach(i=>{
 if(inprog(i))r.push({d:addDays(i.bk||i.date,3),m:`${nm(i.s)} ${rng(i)}: ينتظر إتمام الحفظ`,tab:"mem"});
 if(i.stage==="near")r.push({d:addDays(addDays(rf(i),iv(i)),1),m:`${nm(i.s)} ${rng(i)}: لم تُراجَع`,tab:"near"})});
 Object.keys(st.w).forEach(s=>{const w=st.w[s];r.push({d:addDays(w.last||w.since,wiv(w)+3),m:`سورة ${nm(+s)}: تأخرت مراجعتها الأسبوعية`,tab:"w"})});return r}
const late=()=>gaps().filter(x=>x.d<=today());
function ban(){const l=late();if(!l.length)return"";return `<div class="card warn"><div class="t">⚠ غفلة عن المراجعة (${l.length})</div>${l.slice(0,3).map(x=>`<div class="m" style="margin-top:4px" onclick="go('${x.tab}')">• ${x.m}</div>`).join("")}${l.length>3?`<div class="m">و${l.length-3} أخرى</div>`:""}</div>`}
function ntf(t,b){if("Notification" in window&&Notification.permission==="granted"&&navigator.serviceWorker)navigator.serviceWorker.ready.then(r=>r.showNotification(t,{body:b,icon:"icons/icon-192.png",tag:"hifz",lang:"ar",dir:"rtl"})).catch(()=>{})}
async function enRm(){if(!("Notification" in window))return toast("المتصفح لا يدعم الإشعارات");if(await Notification.requestPermission()!=="granted")return toast("لم يُمنح إذن الإشعارات");st.set.rm=true;save();try{const r=await navigator.serviceWorker.ready;if(r.periodicSync)await r.periodicSync.register("hifz-check",{minInterval:12*36e5})}catch(e){}toast("فُعّل التذكير");render()}
function remind(){const l=late(),n=new Date(),hm=String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0");if(st.set.rm&&l.length&&st.set.ln!==today()&&hm>=st.set.hr){st.set.ln=today();save();ntf("⚠ غفلة عن المراجعة",l.length+" من محفوظك يحتاج مراجعة: "+l[0].m)}}
/* Push من الخادم (Netlify Functions) */
const b64u=t=>{const r=atob((t+"=".repeat((4-t.length%4)%4)).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(r,c=>c.charCodeAt(0))};
const pushOk=()=>"serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window;
const post=b=>fetch("/api/push-sync",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b)}).then(r=>{if(!r.ok)throw 0});
async function pushSync(){if(!st.set.push||!pushOk()||Notification.permission!=="granted")return;try{const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();if(!sub){const k=await(await fetch("/api/vapid")).json();sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(k.key)})}await post({sub:sub.toJSON(),hr:st.set.hr,tz:Intl.DateTimeFormat().resolvedOptions().timeZone,gaps:gaps().map(x=>({d:x.d,m:x.m}))});return true}catch(e){return false}}
let psT;function psyncLater(){if(!st.set.push)return;clearTimeout(psT);psT=setTimeout(pushSync,3000)}
async function pushOn(){

  await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(k.key)})}
 catch(e){return toast("تعذّر الاشتراك: تأكد من نشر الخادم وضبط مفاتيح VAPID")}

const tmo=k=>st.tm[k]||(st.tm[k]={run:0,t0:0,acc:0,tg:15,al:0});
const tsec=k=>{const t=tmo(k);return Math.floor(t.acc+(t.run?(Date.now()-t.t0)/1000:0))};
const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function tgl(k){const t=tmo(k);if(t.run){t.acc+=(Date.now()-t.t0)/1000;t.run=0}else{t.t0=Date.now();t.run=1;t.al=0}save();render()}
function tdone(k){const s=tsec(k);if(s<30)return toast("الجلسة قصيرة جداً للحفظ");st.ses.push({d:today(),k,s});st.tm[k]={run:0,t0:0,acc:0,tg:tmo(k).tg,al:0};save();toast(`حُفظت الجلسة: ${Math.round(s/60)} دقيقة`);render()}
function tset(k,v){tmo(k).tg=+v;tmo(k).al=0;save()}
function tbar(k){const t=tmo(k),td=Math.round(st.ses.filter(x=>x.d===today()&&x.k===k).reduce((a,x)=>a+x.s,0)/60);
 return `<div class="card tm"><div class="top"><span class="m">⏱ مؤقت الجلسة</span><span class="m">مجموع اليوم: ${td} د</span></div><div class="top"><b id="tmv">${fmt(tsec(k))}</b><select onchange="tset('${k}',this.value)"><option value="0">بلا هدف</option>${[10,15,20,30,45,60].map(x=>`<option value="${x}" ${t.tg==x?"selected":""}>الهدف ${x} د</option>`).join("")}</select></div><div class="acts"><button onclick="tgl('${k}')">${t.run?"⏸ إيقاف":"▶ ابدأ"}</button><button class="ghost" onclick="tdone('${k}')">💾 حفظ الجلسة</button></div></div>`}
setInterval(()=>{Object.keys(st.tm).forEach(k=>{const t=st.tm[k];if(!t.run)return;const s=tsec(k);if(k===st.tab&&$("#tmv"))$("#tmv").textContent=fmt(s);if(t.tg&&!t.al&&s>=t.tg*60){t.al=1;save();navigator.vibrate&&navigator.vibrate([200,100,200]);toast("⏰ انتهى وقت الجلسة المحدد");ntf("متابعة الحفظ","انتهى وقت الجلسة المحدد")}})},1000);

 else if(g===1)toast(`يُعاد في نفس المستوى بعد ${iv(i)} يوم`);

function revW(s,g){const w=st.w[s],its=st.items.filter(i=>i.s===s&&i.stage==="wird"),n=wnext(w,g),ef=efn(efo(w),g);w.last=today();lg("w",g);

 else{w.ef=ef;w.iv=n;toast(g<=1?"مراجعتها القادمة بعد 3 أيام":`أحسنت — المراجعة القادمة بعد ${n} يوم`)}

function streak(){const s=new Set(st.log.map(x=>x.d));let d=today(),n=0;if(!s.has(d))d=addDays(d,-1);while(s.has(d)){n++;d=addDays(d,-1)}return n}
function statCard(){const f=addDays(today(),-6),l=st.log.filter(x=>x.d>=f),r=l.filter(x=>x.q!==undefined),g=r.filter(x=>x.q>=2).length;return `<div class="card"><div class="top"><span class="t">🔥 ${streak()} يوم متتالٍ</span><span class="m">آخر 7 أيام</span></div><div class="m" style="margin-top:6px">مقاطع جديدة: <b>${l.filter(x=>x.t==="h").length}</b> · مراجعات: <b>${r.length}</b> · متقنة: <b>${r.length?Math.round(g/r.length*100):0}%</b></div></div>`}

<div class="card"><div class="t">١) الحفظ العقلي</div><p class="m">تسع تكرارات: ثلاثة استماعات مركّزة لمصحف مجوَّد، ثم ثلاث مرات نظرًا، ثم ثلاث عن ظهر قلب. تتابعها بالأزرار + و − على بطاقة المقطع.</p></div>
<div class="card"><div class="t">٢) الحفظ اللساني</div><p class="m">أكثر من 30 تكرارًا تُثبّت المقطع على اللسان (الهدف قابل للتعديل من ⚙). فإن بقي مقطع في الحفظ 3 أيام دون إتمام عُدّ غفلة.</p></div>
<div class="card"><div class="t">٣) المراجعة المتباعدة (SM-2)</div><p class="m">المراجعة الأولى بعد 3 أيام من الحفظ اللساني، والثانية بعد 7 أيام، ثم يُحسب الفاصل بمعادلة SM-2: الفاصل السابق × «معامل سهولة» خاص بكل مقطع (يبدأ 2.5، أدناه 1.3، وأقصى فاصل 90 يومًا). قيّم كل مراجعة بصدق: «متقنة» تنقلك إلى التالية، و«سهلة» تفعل ذلك وتزيد المعامل فتطول الفواصل، و«متردد» تُبقيك في مستواك وتُنقص المعامل، و«ضعيفة» تعيد المقطع إلى الحفظ اللساني وتُنقص المعامل كثيرًا. تحت كل زر الفاصل المتوقع. يصير المقطع «مثبّتًا» حين يبلغ فاصله القادم 30 يومًا فأكثر. من ينساه الحافظ 3 مرات تظهر عليه شارة «متعثّر» ليُعطى وقتًا أطول.</p></div>
<div class="card"><div class="t">٤) الورد الأسبوعي</div><p class="m">تدخل السورة الورد تلقائيًا حين تكتمل آياتها وتُثبَّت كل مقاطعها، أو تنقلها بنفسك. تُراجَع كل 7 أيام افتراضيًا، ويمكنك من ⚙ رفع أقصى فاصل إلى 10 أو 14 أو 21 أو 30 يومًا فيتسع الفاصل تدريجيًا بحسب سهولة السورة عليك. «متردد» يقرّب موعدها إلى 3 أيام، و«ضعيفة» تعيدها إلى المراجعة المتباعدة. تأخرها 3 أيام عن موعدها غفلة.</p></div>
<div class="card"><div class="t">لماذا التباعد؟</div><p class="m">أظهر تحليل Cepeda وزملائه (2006) لمئات التجارب أن توزيع المراجعة عبر الزمن يحسّن الاحتفاظ بالمعلومة، وبيّنت دراستهم (2008) أن الفاصل الأنسب يطول كلما طالت المدة التي تريد حفظ المادة فيها، وأن الفاصل القصير جدًا أضرّ من الطويل. وصنّف Dunlosky وزملاؤه (2013) الممارسة الموزعة ضمن أعلى التقنيات فائدة. أرقام الفواصل هنا تقريبية فاضبطها بتجربتك.</p></div>
<div class="card"><div class="t">الغفلة والتذكير والمواضع</div><p class="m">عند وجود غفلة يظهر تنبيه أحمر أعلى كل شاشة، ويسألك التطبيق قبل بدء حفظ جديد وعندك مراجعة متأخرة. سجّل مواضع التردد بزر «＋ موضع» وركّز عليها عند المراجعة. لكل مرحلة مؤقت جلسة، وتعرض شاشة «اليوم» سلسلة أيامك.</p></div>
<div class="card"><div class="t">قاعدة ذهبية</div><p class="m">راجع أولاً ثم احفظ. المراجعة المنتظمة أنفع من كثرة الجديد.</p></div>`}
function vS(){const ok="Notification" in window&&Notification.permission==="granted",s=st.set,push=s.push&&ok;
 return `<div class="card"><div class="t">⚙ الإعدادات</div><label>هدف التكرار في الحفظ اللساني (30 فأكثر)</label><input type="number" inputmode="numeric" min="1" value="${LT()}" onchange="st.set.lt=Math.max(1,+this.value||30);save();render()">
 <label>وقت التذكير اليومي</label><input type="time" value="${s.hr}" onchange="st.set.hr=this.value;save()">
 <label>أقصى فاصل لمراجعة الورد الأسبوعي</label><select onchange="st.set.wm=+this.value;save();render()">${[7,10,14,21,30].map(x=>`<option value="${x}" ${wmax()==x?"selected":""}>${x} أيام${x==7?" (الافتراضي)":""}</option>`).join("")}</select>
 <div class="acts"><button onclick="enRm()">${ok&&s.rm?"🔔 التذكير مفعّل":"🔔 تفعيل الإشعارات"}</button><button class="ghost" onclick="ics()">📆 تذكير في التقويم</button></div>
 <div class="m" style="margin-top:8px">إشعارات المتصفح تعمل عند فتح التطبيق، وفي الخلفية فقط إن سمح بها النظام.</div></div>
 <div class="card"><div class="t">📡 إشعار مضمون من الخادم</div><div class="m">يصلك تنبيه الغفلة في وقت التذكير حتى لو كان التطبيق مغلقاً. يرسل الجهاز للخادم مواعيد المراجعة فقط (تواريخ وأسماء السور)، وتبقى بقية بياناتك على جهازك.</div>
 <div class="acts">${push?`<button class="ghost" onclick="pushOff()">🔕 إيقاف</button><button class="ghost" onclick="pushSync().then(o=>toast(o?'تمت المزامنة':'تعذّرت المزامنة'))">🔄 مزامنة الآن</button>`:`<button onclick="pushOn()">📡 تفعيل الإشعار المضمون</button>`}</div>${push?'<div class="m" style="margin-top:8px">✔ مفعّل على هذا الجهاز</div>':""}</div>
 <div class="card"><div class="t">💾 نسخة احتياطية</div><div class="m">بياناتك محفوظة في هذا المتصفح فقط، فاحتفظ بنسخة. يقبل الاستيراد نسخ هذا التطبيق ونسخ التطبيقين القديمين.</div>
 <div class="acts"><button class="ghost" onclick="exp()">تصدير ملف</button><button class="ghost" onclick="$('#f').click()">استيراد ملف</button><button class="ghost" onclick="st.bk=!st.bk;render()">نسخ/لصق نص</button><input id="f" type="file" accept=".json" hidden onchange="imp(this.files[0])"></div>
 ${st.bk?`<textarea id="bkt" rows="6" style="margin-top:10px">${esc(JSON.stringify(dat()))}</textarea><div class="acts"><button class="ghost" onclick="$('#bkt').focus();$('#bkt').select()">تحديد النص للنسخ</button><button class="ghost" onclick="impT($('#bkt').value)">استيراد من النص</button></div>`:""}</div>`}
function render(){
 const it=st.items,pg=it.filter(inprog),dn=it.filter(nd),dwk=Object.keys(st.w).filter(wd),k=st.tab;
 $("#hs").innerHTML=`<div><b>${pg.length}</b>قيد الحفظ</div><div><b>${dn.length+dwk.length}</b>مستحقة اليوم</div><div><b>${it.filter(i=>i.stage==="stable"||i.stage==="wird").length}</b>مثبّتة</div>`;
 const tabs=[["today","🏠","اليوم",dn.length+dwk.length],["mem","🧱","الحفظ",pg.length],["near","🔁","المراجعة",dn.length],["w","📅","الأسبوعي",dwk.length],["m","📘","المنهجية",0]];
 $("#nav").innerHTML=tabs.map(t=>`<button class="${k===t[0]?"on":""}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}${t[3]?`<em>${t[3]}</em>`:""}</button>`).join("");
 $("#app").innerHTML=ban()+(["mem","near","w"].includes(k)?tbar(k):"")+{today:vToday,mem:vMem,near:vN,w:vW,m:vM,s:vS}[k]();
 $("#hd").textContent=fd(today());
 const s=$("#s");if(s)s.onchange=()=>{st.sel=+s.value;render()};
 const a=$("#a");if(a)a.onchange=fixTo;
}
render();remind();pushSync();
</script>
